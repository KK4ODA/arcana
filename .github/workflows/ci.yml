name: CI

on:
  push:
    branches: ['**']
  pull_request:
  # The release workflow runs the same checks before it builds anything.
  workflow_call:
    inputs:
      package:
        description: Also build the release files (the release workflow builds its own)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: go vet
        run: go vet ./... && go vet -tags acceptance ./test/acceptance
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Fetch kiwix-serve (pinned, hash-verified)
        shell: bash
        run: scripts/fetch-kiwix.sh
      - name: Unit and integration tests (race detector)
        if: runner.os == 'Linux'
        run: go test -race -count=1 ./...
      - name: Unit and integration tests
        if: runner.os != 'Linux'
        run: go test -count=1 ./...

  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch kiwix-serve
        run: scripts/fetch-kiwix.sh
      - name: Install Playwright for the UI tripwire
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw"
          npm init -y >/dev/null && npm install playwright@1.49.1
          npx playwright install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
      - name: Allow unprivileged network namespaces
        # Ubuntu 24.04 restricts user namespaces through AppArmor; the test
        # needs one to cut itself off from the internet.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Offline acceptance test
        run: go test -tags acceptance -count=1 -v ./test/acceptance

  appliance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install checkers
        run: sudo apt-get update && sudo apt-get install -y shellcheck nftables
      - name: Shell scripts
        run: |
          sh -n packaging/appliance/install.sh
          shellcheck -s sh packaging/appliance/install.sh packaging/arcana.sh scripts/*.sh tools/*.sh
      - name: Installer dry run
        run: packaging/appliance/install.sh --dry-run --ap --country DE --ssid "CI test" --wifi-password "ci-password-1"
      - name: systemd units
        run: |
          mkdir -p /tmp/units && cp packaging/appliance/*.service /tmp/units/
          sed -i 's#/opt/arcana/arcana#/bin/true#' /tmp/units/arcana.service
          systemd-analyze verify --man=no /tmp/units/arcana.service /tmp/units/arcana-captive.service
      - name: nftables rules
        run: sed 's/@IFACE@/wlan0/' packaging/appliance/captive.nft > /tmp/captive.nft && sudo nft -c -f /tmp/captive.nft

  build:
    # On its own CI always packages; when the release workflow calls it
    # (github.workflow is then "Release"), only if asked to.
    if: ${{ github.workflow == 'CI' || inputs.package }}
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # kiwix-serve binaries, their sources (about 170 MB) and the Visual
      # C++ runtime, pinned by the fetch scripts: download them once per
      # change of the pins.
      - uses: actions/cache@v4
        with:
          path: |
            third_party/kiwix
            third_party/kiwix-src
            third_party/vcruntime
          key: kiwix-${{ hashFiles('scripts/fetch-kiwix.sh', 'scripts/fetch-kiwix-sources.sh', 'scripts/fetch-vcruntime.sh') }}
      - name: Install cabextract (unpacks the Visual C++ runtime)
        run: sudo apt-get install -y -q cabextract || (sudo apt-get update -q && sudo apt-get install -y -q cabextract)
      - name: Package release files (all platforms)
        run: scripts/package.sh "0.0.0-ci.${GITHUB_RUN_NUMBER}"
      - uses: actions/upload-artifact@v4
        with:
          name: arcana-ci-build
          # The sources archive is published with releases; leave it out of
          # the per-push artifact.
          path: |
            dist/arcana-*
            !dist/arcana-*-kiwix-sources.tar
            dist/SHA256SUMS
          retention-days: 14

  windows-package:
    # The packaged Windows build runs kiwix-serve with the Visual C++
    # runtime it ships, loaded from its own folder.
    needs: [build]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8
        with:
          name: arcana-ci-build
          path: dist
      - name: Run the packaged kiwix-serve
        shell: pwsh
        run: ./scripts/check-windows-runtime.ps1 (Get-ChildItem dist/arcana-*-windows-amd64.zip).FullName testdata/sample/arcana-sample_en_2026-11.zim
