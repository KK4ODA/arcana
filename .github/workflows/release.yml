name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: scripts/fetch-kiwix.sh && go test -count=1 ./...
      - name: Package
        run: scripts/package.sh "${GITHUB_REF_NAME#v}"
      - name: Publish release (draft)
        env:
          GH_TOKEN: ${{ github.token }}
        # Drafts are reviewed and the release manifest signed offline by a
        # maintainer before publication (docs/adr/0011).
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.sha256 --draft --title "Arcana $GITHUB_REF_NAME" --notes-file CHANGELOG.md
