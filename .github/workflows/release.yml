name: Release

# Pushing a tag vX.Y.Z (or vX.Y.Z-suffix for a pre-release) builds and
# publishes a release. So does starting this workflow by hand on main with
# a version (Actions → Release → Run workflow, or the GitHub API): it
# releases main as it is at that moment and creates the tag itself, last,
# once everything has passed ("check only" runs everything but publishes
# nothing). Either way:
#   1. the version must match a finished CHANGELOG.md section;
#   2. every CI check runs (lint, tests on Linux, Windows and macOS, the
#      offline acceptance test, appliance checks);
#   3. the release files are built, checked and given build provenance, and
#      the Windows build is run on Windows;
#   4. the GitHub release is created with notes from CHANGELOG.md.
#
# Update signing (docs/adr/0011): the programs trust the project's release
# key (internal/buildinfo). The secret ARCANA_SIGNING_KEY holds its private
# half; the manifests are signed here and checked against the compiled-in
# key, so a wrong secret fails the build. Without the secret the release is
# left as a draft until a maintainer signs release.json offline and uploads
# release.json.sig: an unsigned release must never reach users, because
# their in-app updater would reject it. The optional variable
# ARCANA_UPDATE_PUBKEY replaces the compiled-in key list (key rotation).

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to release from main, e.g. 0.9.1 (tagged v0.9.1); a suffix (0.9.1-rc.1) makes a pre-release
        required: true
        type: string
      check_only:
        description: Run every check and build, but create no tag and no release
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
      - name: Check the version against CHANGELOG.md
        id: v
        env:
          # Inputs reach the script as variables, never as script text.
          INPUT_VERSION: ${{ inputs.version }}
          CHECK_ONLY: ${{ inputs.check_only }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            if [ "$GITHUB_REF" != refs/heads/main ]; then
              echo "::error::Start a release from main (this run is on $GITHUB_REF)."
              exit 1
            fi
            v="${INPUT_VERSION#v}"
            # A bash match, not a "| grep -q" pipeline (SIGPIPE under pipefail).
            if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::Not a version: '$INPUT_VERSION' (expected X.Y.Z or X.Y.Z-suffix)."
              exit 1
            fi
            if [ -n "$(git ls-remote --tags origin "refs/tags/v$v")" ]; then
              echo "::error::Tag v$v already exists. Choose a new version; to finish a release that failed while publishing, re-run only the failed jobs of its run."
              exit 1
            fi
            publish=true
            [ "$CHECK_ONLY" = true ] && publish=false
            echo "Releasing main at $GITHUB_SHA as v$v (publish: $publish)."
          else
            v="${GITHUB_REF_NAME#v}"
            publish=true
          fi
          scripts/release-notes.sh "$v" > /dev/null
          {
            echo "version=$v"
            echo "tag=v$v"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"

  ci:
    needs: prepare
    uses: ./.github/workflows/ci.yml
    with:
      package: false

  build:
    needs: [prepare, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      HAS_SIGNING_KEY: ${{ secrets.ARCANA_SIGNING_KEY != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # The pinned kiwix-serve binaries, their sources and the Visual C++
      # runtime: the same cache the CI build job fills on main (a tag can
      # restore caches from the default branch), so a release does not
      # depend on download.kiwix.org answering at that moment. The fetch
      # scripts check the sources and the Visual C++ runtime against their
      # pinned SHA-256 again after a restore; the kiwix-serve binaries were
      # checked against the pinned archive hash when the CI build on main
      # first downloaded them, and are not re-checked on restore.
      - uses: actions/cache@v4
        with:
          path: |
            third_party/kiwix
            third_party/kiwix-src
            third_party/vcruntime
          key: kiwix-${{ hashFiles('scripts/fetch-kiwix.sh', 'scripts/fetch-kiwix-sources.sh', 'scripts/fetch-vcruntime.sh') }}
      - name: Install cabextract (unpacks the Visual C++ runtime)
        run: sudo apt-get install -y -q cabextract || (sudo apt-get update -q && sudo apt-get install -y -q cabextract)
      - name: Build release files
        env:
          ARCANA_UPDATE_PUBKEY: ${{ vars.ARCANA_UPDATE_PUBKEY }}
          ARCANA_SIGNING_KEY: ${{ secrets.ARCANA_SIGNING_KEY }}
        run: scripts/package.sh "$VERSION"
      - name: Check the release files
        run: |
          cd dist
          sha256sum -c SHA256SUMS
          tmp=$(mktemp -d)
          tar -xzf "arcana-$VERSION-linux-amd64.tar.gz" -C "$tmp"
          # No "| grep -q" pipelines: with pipefail an early grep exit can
          # fail the step through SIGPIPE.
          "$tmp/Arcana/bin/linux-amd64/arcana" version > "$tmp/version.txt"
          cat "$tmp/version.txt"
          grep -q "^arcana $VERSION " "$tmp/version.txt"
          test -f "$tmp/Arcana/licenses/SOURCES.txt"
          # The sources download is complete: every file it lists is there
          # with the pinned content.
          mkdir "$tmp/src"
          tar -xf "arcana-$VERSION-kiwix-sources.tar" -C "$tmp/src"
          (cd "$tmp/src" && sha256sum -c --quiet SHA256SUMS && test -f SOURCES.txt && test -f kiwix-tools-3.8.2.tar.xz)
      - name: Check the update signatures
        if: ${{ env.HAS_SIGNING_KEY == 'true' }}
        run: |
          go run ./tools/release-sign verify -in dist/release.json
          go run ./tools/release-sign verify -in dist/Arcana/release.json
      - name: Build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/arcana-*
            dist/release.json
      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: |
            dist/arcana-*
            dist/SHA256SUMS
            dist/release.json
            dist/release.json.sig
          if-no-files-found: error
          retention-days: 30

  check-windows:
    # The Windows release file runs kiwix-serve with the Visual C++ runtime
    # it ships, loaded from its own folder.
    needs: [prepare, build]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: dist
      - name: Run the packaged kiwix-serve
        shell: pwsh
        run: ./scripts/check-windows-runtime.ps1 dist/arcana-${{ needs.prepare.outputs.version }}-windows-amd64.zip testdata/sample/arcana-sample_en_2026-11.zim

  publish:
    needs: [prepare, build, check-windows]
    if: ${{ needs.prepare.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ needs.prepare.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
      PRIVATE_REPO: ${{ github.event.repository.private }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: dist
      - name: Create the release
        run: |
          signed=unsigned
          [ -f dist/release.json.sig ] && signed=signed
          attested=attested
          [ "$PRIVATE_REPO" = true ] && attested=
          scripts/release-notes.sh "$VERSION" "$signed" "$attested" > notes.md
          flags=""
          case "$VERSION" in *-*) flags="--prerelease" ;; esac
          if [ "$signed" = unsigned ]; then
            # The programs trust the release key, so release.json must be
            # signed before anyone can download it (ADR-0011).
            flags="$flags --draft"
            echo "::warning::Draft release: the ARCANA_SIGNING_KEY secret is missing. Sign release.json offline (release-sign sign) and upload release.json.sig, then publish."
          fi
          files=""
          for f in dist/arcana-* dist/SHA256SUMS dist/release.json dist/release.json.sig; do
            if [ -f "$f" ]; then files="$files $f"; fi
          done
          # A pushed tag already exists. A run started by hand creates its
          # tag here, on the commit it built, once everything has passed; a
          # tag made with this run's token starts no second release run.
          target="--verify-tag"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            # The tag may have been pushed by hand since the run began: an
            # annotated tag names its commit under ^{}, a plain one directly.
            at=$(git ls-remote --tags origin "refs/tags/$TAG^{}" | awk '{print $1}')
            [ -n "$at" ] || at=$(git ls-remote --tags origin "refs/tags/$TAG" | awk '{print $1}')
            if [ -n "$at" ] && [ "$at" != "$GITHUB_SHA" ]; then
              echo "::error::$TAG was created meanwhile on another commit ($at); nothing published."
              exit 1
            fi
            target="--target $GITHUB_SHA"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Re-run of the same tag: refresh the files, keep the notes.
            # shellcheck disable=SC2086
            gh release upload "$TAG" $files --clobber
          else
            # shellcheck disable=SC2086
            gh release create "$TAG" $files $target --title "Arcana $VERSION" --notes-file notes.md $flags
          fi
          gh release view "$TAG" --json url,isDraft,isPrerelease,assets --jq '{url, isDraft, isPrerelease, assets: [.assets[].name]}'
